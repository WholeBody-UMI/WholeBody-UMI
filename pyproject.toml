[build-system]
requires = ["setuptools==75.1.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wholebody-umi"
version = "0.1.0"
description = "Whole-body motion inference from bimanual palm trajectories"
readme = "README.md"
requires-python = ">=3.8,<3.12"
license = {file = "LICENSE"}
dependencies = ["torch==2.4.1", "numpy==1.24.4", "scipy==1.10.1"]

[project.optional-dependencies]
visualization = ["mujoco==3.2.3", "imageio==2.35.1", "imageio-ffmpeg==0.5.1"]

[project.scripts]
wholebody-umi-generate = "wholebody_umi.cli.generate:main"
wholebody-umi-demo = "wholebody_umi.cli.demo:main"

[tool.uv]
required-version = ">=0.11.26"

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/UNITREE-G1-UPSTREAM-README.md"]

[tool.setuptools.package-data]
wholebody_umi = ["assets/g1/*.xml", "assets/g1/meshes/*.STL"]

[tool.setuptools.packages.find]
where = ["."]
include = ["wholebody_umi*"]
namespaces = false

[tool.ruff]
required-version = "==0.17.0"
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations" = {msg = "Use Python 3.8-compatible annotations without future imports."}
